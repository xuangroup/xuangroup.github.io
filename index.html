<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>xuangroup</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <style>
        @font-face {
            font-family: "Chillax";
            src: url("Chillax-Regular.otf") format("opentype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: 10vh;
            overflow-x: hidden;
        }

        .stage {
            position: relative;
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            width: 46vw;
        }

        .stage .mark {
            display: block;
            width: auto;
            height: 40vh;
            max-width: 100%;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            -webkit-user-drag: none;
        }

        .mark .stroke {
            fill: none;
            stroke: #000000;
            stroke-width: 10;
            stroke-miterlimit: 10;
        }

        .card {
            position: relative;
            transform: translateX(0);
            transition: transform 0.85s cubic-bezier(0.22, 0.61, 0.36, 1);
        }

        .card.is-open {
            transform: translateX(-110px);
        }

        .scramble {
            position: absolute;
            top: 50%;
            left: 100%;
            margin-left: clamp(36px, 6vw, 72px);
            transform: translateY(-50%) translateX(-6px);
            font-family: "Chillax", "SFMono-Regular", "Menlo", "Consolas", monospace;
            font-size: 26px;
            font-weight: 400;
            letter-spacing: 0.04em;
            color: #24292f;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.6s ease;
        }

        .font-metrics {
            position: absolute;
            top: -9999px;
            left: -9999px;
            font-family: "Chillax", monospace;
            font-size: 26px;
        }

        .card.is-open .scramble {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        .icons {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            gap: 2vh;
            margin-top: 3vh;
        }

        .github,
        .discussions {
            display: block;
            padding: 8px;
            color: #24292f;
            line-height: 0;
            transition: color 0.15s ease, transform 0.15s ease;
        }

        .github:hover,
        .discussions:hover {
            color: #0969da;
            transform: scale(1.12);
        }

        .github:focus-visible,
        .discussions:focus-visible {
            outline: 2px solid #0969da;
            outline-offset: 2px;
            border-radius: 6px;
        }

        .github svg,
        .discussions svg {
            display: block;
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        @media (max-width: 600px) {
            .stage {
                width: 62vw;
            }

            .stage .mark {
                height: 30vh;
            }

            .card.is-open {
                transform: translateX(-26px);
            }

            .scramble {
                margin-left: 16px;
                font-size: 19px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card {
                transform: none !important;
                transition: none;
            }

            .scramble {
                transition: opacity 0.2s ease;
            }
        }
    </style>
</head>
<body>

                    <path d="m1099.18 803.44c0 72.84-62.5 131.88-139.59 131.88-77.09 0-139.59-59.04-139.59-131.88 0-72.84 62.5-131.89 139.59-131.89 77.09 0 139.59 59.05 139.59 131.89z"/>

    </div>

    <script>
        (function () {
            var stage = document.getElementById("stage");
            var card = document.getElementById("card");
            var out = document.getElementById("scramble");
            if (!stage || !card || !out) return;

            var mark = card.querySelector(".mark");
            if (!mark) return;

            var TARGETS = ["萱组", "xuangroup", "萱ぐみ"];
            var POOL = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!<>-_\\/[]{}—=+*^?#________あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン萱组組々";

            var timer = null;
            var hideTimer = null;
            var open = false;
            var refRect = null;

            function prefersReducedMotion() {
                try {
                    return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
                } catch (e) {
                    return false;
                }
            }

            function rand(str) {
                return str.charAt(Math.floor(Math.random() * str.length));
            }

            function inRect(r, x, y) {
                return !!r && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
            }

            function overLogo(x, y) {
                return inRect(mark.getBoundingClientRect(), x, y) || inRect(refRect, x, y);
            }

            function stopText() {
                if (timer !== null) {
                    clearInterval(timer);
                    timer = null;
                }
            }

            function hide() {
                clearTimeout(hideTimer);
                hideTimer = null;
                stopText();
                open = false;
                refRect = null;
                card.classList.remove("is-open");
                out.textContent = "";
            }

            function show() {
                clearTimeout(hideTimer);
                hideTimer = null;
                open = true;
                refRect = mark.getBoundingClientRect();
                card.classList.add("is-open");
                scramble(TARGETS[Math.floor(Math.random() * TARGETS.length)]);
            }

            function scramble(target) {
                stopText();

                if (prefersReducedMotion()) {
                    out.textContent = target;
                    return;
                }

                var locked = 0;
                var frame = 0;

                timer = setInterval(function () {
                    if (frame % 3 === 0) locked++;
                    frame++;

                    var text = "";
                    for (var i = 0; i < target.length; i++) {
                        text += i < locked ? target.charAt(i) : rand(POOL);
                    }
                    out.textContent = text;

                    if (locked > target.length) {
                        out.textContent = target;
                        stopText();
                    }
                }, 55);
            }

            stage.addEventListener("pointermove", function (e) {
                if (e.pointerType === "touch") return;
                var hit = overLogo(e.clientX, e.clientY);

                if (hit) {
                    if (!open) show();
                    return;
                }

                if (open) hide();
            });

            stage.addEventListener("pointerleave", function () {
                if (open) hide();
            });

            stage.addEventListener("pointerdown", function (e) {
                if (e.pointerType === "touch" && overLogo(e.clientX, e.clientY)) {
                    show();
                    hideTimer = setTimeout(hide, 2600);
                }
            });

            window.__logoFx = {
                isOpen: function () {
                    return open;
                },
                hit: overLogo,
                rect: function () {
                    return mark.getBoundingClientRect();
                }
            };
        })();
    </script>
